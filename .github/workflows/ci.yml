name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel drags in several GB of CUDA libs.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          pip install -e "./ml[dev,boost,tracking]"
          pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check ml/src ml/scripts ml/tests backend/app backend/tests

      - name: Check formatting
        run: ruff format --check ml/src backend/app

      - name: Run tests
        run: pytest --cov=fraudshield --cov=backend/app --cov-report=term-missing

      - name: Verify the training pipeline runs end to end
        # The Kaggle dataset cannot be committed, so CI exercises the pipeline
        # against the clearly-labelled synthetic fixture. This proves the code
        # path works; it proves nothing about model quality.
        run: |
          python ml/scripts/make_synthetic_data.py --rows 8000 --fraud-rate 0.02
          python ml/scripts/train.py --synthetic --no-deep

      - name: Verify the API starts and serves a prediction
        run: |
          MODEL_DIR=models/fraud_detector \
            python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep '"model_loaded":true'
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"Amount": 120.5, "Time": 3600}' | grep fraud_probability

  frontend:
    name: Lint and build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: fraudshield-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: fraudshield-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
